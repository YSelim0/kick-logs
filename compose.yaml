services:
  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    command: ["--jetstream", "--store_dir", "/data/jetstream"]
    volumes:
      - nats_data:/data

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    mem_limit: 1536m
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-kick_logs}
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-kick_logs}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-kick_logs}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    # Bind published ports to loopback by default so the database is not exposed
    # on the host's public interface. Inter-container access uses the compose
    # network (clickhouse:9000), which does not need a host port mapping.
    ports:
      - "${CH_BIND_HOST:-127.0.0.1}:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CH_BIND_HOST:-127.0.0.1}:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      # Mount only this file, not the whole config.d directory: a directory bind
      # mount would shadow the image's own config.d files (e.g. the one setting
      # listen_host 0.0.0.0), leaving ClickHouse bound to localhost so the api
      # and listener containers get "connection refused" on clickhouse:9000.
      - ./clickhouse/config.d/memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user $$CLICKHOUSE_USER --password $$CLICKHOUSE_PASSWORD --query 'SELECT 1'"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./apps/api-go
      args:
        TARGET: api
    restart: unless-stopped
    mem_limit: 384m
    environment:
      # ~80% of mem_limit (384m) so the Go GC reclaims before the container OOMs.
      GOMEMLIMIT: 307MiB
      APP_NAME: ${APP_NAME:-Kick Logs}
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
      MESSAGE_EXPORT_MAX_ROWS: ${MESSAGE_EXPORT_MAX_ROWS:-1000}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-for-local-development-secret-key}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-10080}
      JWT_COOKIE_NAME: ${JWT_COOKIE_NAME:-kick_logs_session}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      JWT_COOKIE_SAMESITE: ${JWT_COOKIE_SAMESITE:-lax}
      SEED_SUPER_ADMIN_ON_STARTUP: ${SEED_SUPER_ADMIN_ON_STARTUP:-true}
      LISTENER_HEARTBEAT_STALE_AFTER_SECONDS: ${LISTENER_HEARTBEAT_STALE_AFTER_SECONDS:-45}
      SQLITE_PATH: ${SQLITE_PATH:-/data/kick-logs-go.sqlite3}
      CLICKHOUSE_ADDR: ${CLICKHOUSE_ADDR:-clickhouse:9000}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-kick_logs}
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-kick_logs}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-kick_logs}
      CLICKHOUSE_DEBUG: ${CLICKHOUSE_DEBUG:-false}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATS_RAW_EVENT_STREAM: ${NATS_RAW_EVENT_STREAM:-KICK_RAW_EVENTS}
      NATS_RAW_EVENT_SUBJECT: ${NATS_RAW_EVENT_SUBJECT:-kick.raw.chat}
      NATS_RAW_EVENT_CONSUMER: ${NATS_RAW_EVENT_CONSUMER:-kick-raw-event-processor}
      NATS_RAW_EVENT_ACK_WAIT_SECONDS: ${NATS_RAW_EVENT_ACK_WAIT_SECONDS:-60}
      NATS_RAW_EVENT_FETCH_BATCH_SIZE: ${NATS_RAW_EVENT_FETCH_BATCH_SIZE:-500}
      NATS_RAW_EVENT_FETCH_TIMEOUT_SECONDS: ${NATS_RAW_EVENT_FETCH_TIMEOUT_SECONDS:-2}
      DEFAULT_SUPER_ADMIN_EMAIL: ${DEFAULT_SUPER_ADMIN_EMAIL:-admin@kicklogs.local}
      DEFAULT_SUPER_ADMIN_PASSWORD: ${DEFAULT_SUPER_ADMIN_PASSWORD:-admin123}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_STORE_MAX_KEYS: ${RATE_LIMIT_STORE_MAX_KEYS:-65536}
      # Trust a proxy header for the real client IP. Keep true only when the API
      # is reachable solely through the trusted reverse proxy (see #20): bind the
      # port to loopback below and/or firewall the origin, otherwise the header
      # is spoofable and IP rate limits collapse.
      RATE_LIMIT_TRUST_PROXY: ${RATE_LIMIT_TRUST_PROXY:-true}
      # Header carrying the real client IP. CF-Connecting-IP behind Cloudflare;
      # X-Real-IP / X-Forwarded-For behind a plain nginx reverse proxy.
      RATE_LIMIT_CLIENT_IP_HEADER: ${RATE_LIMIT_CLIENT_IP_HEADER:-CF-Connecting-IP}
      KICK_CLIENT_ID: ${KICK_CLIENT_ID:-}
      KICK_CLIENT_SECRET: ${KICK_CLIENT_SECRET:-}
      KICK_API_BASE_URL: ${KICK_API_BASE_URL:-https://api.kick.com}
      KICK_OAUTH_TOKEN_URL: ${KICK_OAUTH_TOKEN_URL:-https://id.kick.com/oauth/token}
      # Optional manual override. Normally empty: the API fetches the webhook
      # public key from Kick with the client credentials.
      KICK_WEBHOOK_PUBLIC_KEY: ${KICK_WEBHOOK_PUBLIC_KEY:-}
      KICK_WEBHOOK_SYNC_ENABLED: ${KICK_WEBHOOK_SYNC_ENABLED:-true}
      KICK_WEBHOOK_EVENTS: ${KICK_WEBHOOK_EVENTS:-channel.subscription.new,channel.subscription.renewal,channel.subscription.gifts}
      KICK_WEBHOOK_PROCESS_BATCH_SIZE: ${KICK_WEBHOOK_PROCESS_BATCH_SIZE:-50}
      KICK_WEBHOOK_PROCESS_MAX_ATTEMPTS: ${KICK_WEBHOOK_PROCESS_MAX_ATTEMPTS:-5}
      # Local debug escape hatch only. Keep false in every real deployment.
      KICK_WEBHOOK_SKIP_VERIFICATION: ${KICK_WEBHOOK_SKIP_VERIFICATION:-false}
    depends_on:
      nats:
        condition: service_started
      clickhouse:
        condition: service_healthy
    # Loopback by default: the API is meant to sit behind a reverse proxy on the
    # host. If you run without a local proxy, set API_BIND_HOST=0.0.0.0.
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - api_go_data:/data

  listener:
    build:
      context: ./apps/api-go
      args:
        TARGET: listener
    restart: unless-stopped
    mem_limit: 512m
    environment:
      # ~80% of mem_limit (512m) so the Go GC reclaims before the container OOMs.
      GOMEMLIMIT: 410MiB
      APP_NAME: ${APP_NAME:-Kick Logs}
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KICK_PUSHER_URL: ${KICK_PUSHER_URL:-wss://ws-us2.pusher.com/app/32cbd69e4b950bf97679?protocol=7&client=js&version=8.4.0-rc2&flash=false}
      LISTENER_RECONNECT_INITIAL_DELAY_SECONDS: ${LISTENER_RECONNECT_INITIAL_DELAY_SECONDS:-1}
      LISTENER_RECONNECT_MAX_DELAY_SECONDS: ${LISTENER_RECONNECT_MAX_DELAY_SECONDS:-30}
      LISTENER_RECONNECT_MULTIPLIER: ${LISTENER_RECONNECT_MULTIPLIER:-2}
      LISTENER_WORKER_COUNT: ${LISTENER_WORKER_COUNT:-4}
      # Stage 2 normalize: claim/insert more rows per tick → fewer chat_messages parts.
      LISTENER_RAW_EVENT_BATCH_SIZE: ${LISTENER_RAW_EVENT_BATCH_SIZE:-500}
      LISTENER_RAW_EVENT_PROCESSING_TIMEOUT_SECONDS: ${LISTENER_RAW_EVENT_PROCESSING_TIMEOUT_SECONDS:-300}
      LISTENER_RAW_EVENT_MAX_ATTEMPTS: ${LISTENER_RAW_EVENT_MAX_ATTEMPTS:-5}
      LISTENER_RAW_EVENT_WORKER_IDLE_DELAY_SECONDS: ${LISTENER_RAW_EVENT_WORKER_IDLE_DELAY_SECONDS:-0.25}
      # Stage 1 ingest: larger/less-frequent raw_kick_events batches → fewer parts, less merge RAM.
      # Flush stays at 1.5s (not higher) to keep the crash-loss window small with the 50k queue.
      LISTENER_RAW_EVENT_WRITE_BATCH_SIZE: ${LISTENER_RAW_EVENT_WRITE_BATCH_SIZE:-1000}
      LISTENER_RAW_EVENT_WRITE_FLUSH_INTERVAL_MS: ${LISTENER_RAW_EVENT_WRITE_FLUSH_INTERVAL_MS:-1500}
      # Disabled by default: active raw-event work lives in SQLite. Enable only
      # for one-off recovery from an old ClickHouse raw-event archive.
      LISTENER_BOOTSTRAP_RAW_QUEUE_ON_STARTUP: ${LISTENER_BOOTSTRAP_RAW_QUEUE_ON_STARTUP:-false}
      LISTENER_CHANNEL_RESYNC_INTERVAL_SECONDS: ${LISTENER_CHANNEL_RESYNC_INTERVAL_SECONDS:-60}
      LISTENER_HEARTBEAT_INTERVAL_SECONDS: ${LISTENER_HEARTBEAT_INTERVAL_SECONDS:-15}
      LISTENER_HEARTBEAT_STALE_AFTER_SECONDS: ${LISTENER_HEARTBEAT_STALE_AFTER_SECONDS:-45}
      SQLITE_PATH: ${SQLITE_PATH:-/data/kick-logs-go.sqlite3}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATS_RAW_EVENT_STREAM: ${NATS_RAW_EVENT_STREAM:-KICK_RAW_EVENTS}
      NATS_RAW_EVENT_SUBJECT: ${NATS_RAW_EVENT_SUBJECT:-kick.raw.chat}
      NATS_RAW_EVENT_CONSUMER: ${NATS_RAW_EVENT_CONSUMER:-kick-raw-event-processor}
      NATS_RAW_EVENT_ACK_WAIT_SECONDS: ${NATS_RAW_EVENT_ACK_WAIT_SECONDS:-60}
      NATS_RAW_EVENT_FETCH_BATCH_SIZE: ${NATS_RAW_EVENT_FETCH_BATCH_SIZE:-500}
      NATS_RAW_EVENT_FETCH_TIMEOUT_SECONDS: ${NATS_RAW_EVENT_FETCH_TIMEOUT_SECONDS:-2}
    depends_on:
      nats:
        condition: service_started
    volumes:
      - api_go_data:/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_* is inlined into the client bundle at build time, so the
        # API base URL must be passed as a build arg, not only as runtime env.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    mem_limit: 768m
    environment:
      NEXT_TELEMETRY_DISABLED: 1
    depends_on:
      - api
    # Loopback by default (sits behind a host reverse proxy). Set
    # WEB_BIND_HOST=0.0.0.0 to expose it directly without a local proxy.
    ports:
      - "${WEB_BIND_HOST:-127.0.0.1}:${WEB_PORT:-3000}:3000"

  migrate-go:
    profiles:
      - tools
    build:
      context: ./apps/api-go
      args:
        TARGET: migrate
    environment:
      APP_NAME: ${APP_NAME:-Kick Logs}
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SQLITE_PATH: ${SQLITE_PATH:-/data/kick-logs-go.sqlite3}
      POSTGRES_SOURCE_DSN: ${POSTGRES_SOURCE_DSN:-}
      CLICKHOUSE_ADDR: ${CLICKHOUSE_ADDR:-clickhouse:9000}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-kick_logs}
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-kick_logs}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-kick_logs}
      CLICKHOUSE_DEBUG: ${CLICKHOUSE_DEBUG:-false}
      DEFAULT_SUPER_ADMIN_EMAIL: ${DEFAULT_SUPER_ADMIN_EMAIL:-admin@kicklogs.local}
      DEFAULT_SUPER_ADMIN_PASSWORD: ${DEFAULT_SUPER_ADMIN_PASSWORD:-admin123}
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - api_go_data:/data

volumes:
  nats_data:
  clickhouse_data:
  api_go_data:
