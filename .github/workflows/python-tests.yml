name: Python CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kick_logs
          POSTGRES_USER: kick_logs
          POSTGRES_PASSWORD: kick_logs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kick_logs -d kick_logs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    env:
      APP_NAME: Kick Logs
      APP_ENV: test
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://kick_logs:kick_logs@localhost:5432/kick_logs
      DATABASE_ECHO: "false"
      JWT_SECRET_KEY: github-actions-test-secret-key-change-me
      JWT_ALGORITHM: HS256
      JWT_EXPIRES_MINUTES: "10080"
      JWT_COOKIE_NAME: kick_logs_session
      JWT_COOKIE_SECURE: "false"
      JWT_COOKIE_SAMESITE: lax
      SEED_SUPER_ADMIN_ON_STARTUP: "false"
      DEFAULT_SUPER_ADMIN_EMAIL: admin@kicklogs.local
      DEFAULT_SUPER_ADMIN_PASSWORD: admin123
      BACKEND_CORS_ORIGINS: http://localhost:3000
      KICK_PUSHER_URL: wss://ws-us2.pusher.com/app/32cbd69e4b950bf97679?protocol=7&client=js&version=8.4.0-rc2&flash=false
      LISTENER_RECONNECT_INITIAL_DELAY_SECONDS: "1"
      LISTENER_RECONNECT_MAX_DELAY_SECONDS: "30"
      LISTENER_RECONNECT_MULTIPLIER: "2"
      LISTENER_WORKER_COUNT: "4"
      LISTENER_RAW_EVENT_BATCH_SIZE: "100"
      LISTENER_RAW_EVENT_PROCESSING_TIMEOUT_SECONDS: "300"
      LISTENER_RAW_EVENT_MAX_ATTEMPTS: "5"
      LISTENER_RAW_EVENT_WORKER_IDLE_DELAY_SECONDS: "0.25"
      LISTENER_CHANNEL_RESYNC_INTERVAL_SECONDS: "60"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install backend dependencies
        run: python -m uv sync --frozen --group dev

      - name: Apply database migrations
        run: python -m uv run alembic upgrade head

      - name: Check Python formatting
        run: python -m uv run ruff format --check .

      - name: Run ruff
        run: python -m uv run ruff check .

      - name: Run pytest
        run: python -m uv run pytest
